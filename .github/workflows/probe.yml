name: network-probe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe data sources
        run: |
          D=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "probe at: $D" > probe_result.txt
          echo "runner: $(uname -a)" >> probe_result.txt
          node -v >> probe_result.txt
          python3 -V >> probe_result.txt
          probe() {
            local url="$1"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -A "Mozilla/5.0" "$url" 2>/dev/null || echo "ERR")
            local sz
            sz=$(curl -s -o /dev/null -w "%{size_download}" --max-time 20 -A "Mozilla/5.0" "$url" 2>/dev/null || echo "0")
            echo "$url -> HTTP $code size=$sz" >> probe_result.txt
          }
          probe "https://vip.titan007.com/"
          probe "https://bf.titan007.com/football/Over_20261012.htm"
          probe "https://www.okooo.com/"
          probe "https://m.okooo.com/"
          probe "https://m.gqj2.tv/api/new/getfootball_list?day=20261013&state=-1"
          probe "https://webapi.sporttery.cn/"
          probe "https://trade.500.com/"
          echo "---- done ----" >> probe_result.txt
          cat probe_result.txt
      - name: commit result
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add probe_result.txt
          git commit -m "network probe $(date -u +%Y%m%d-%H%M)" || echo "no change"
          git push
